<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Korean Plaza — Shop</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


 


  <style>
    .product:hover{transform:translateY(-2px);box-shadow:0 .5rem 1rem rgba(0,0,0,.08)}
    .square{aspect-ratio:1/1;background:#edc6ec;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .square img{width:100%;height:100%;object-fit:cover}
  </style>
</head>
<body>

  
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">KOREAN PICK</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Deals</a></li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search products">
          <button class="btn btn-dark" type="submit">Search</button>
        </form>
        <a class="btn btn-outline-secondary ms-2" href="#">Cart (0)</a>
      </div>
    </div>
  </nav>


  <section class="py-5 text-center bg-light">
    <div class="container">
      <h1 class="h3 mb-2">Fresh picks for you</h1>
      <p class="text-secondary mb-3">Minimalistic items at best price.</p>
      <a href="#" class="btn btn-primary btn-sm">Shop now</a>
    </div>
  </section>

 
  <div class="border-bottom">
    <div class="container py-3 d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-secondary btn-sm">All</button>
      <button class="btn btn-outline-secondary btn-sm">New</button>
      <button class="btn btn-outline-secondary btn-sm">Popular</button>
      <button class="btn btn-outline-secondary btn-sm">Sale</button>
    </div>
  </div>

  <main class="container my-4">
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
      
      <div class="col">
        <div class="card product h-100">
          <div class="square">
            
            <img src="wallet.avif">
          </div>
          <div class="card-body py-2">
            <div class="fw-semibold small">Wallet</div>
            <div class="text-secondary small mb-2">₹599</div>
            <button class="btn btn-sm btn-dark w-100">Add to cart</button>
          </div>
        </div>
      </div>

      <div class="col"><div class="card product h-100"><div class="square"><img src="airpods.jpg"></div><div class="card-body py-2"><div class="fw-semibold small">Airpods</div><div class="text-secondary small mb-2">₹1299</div><button class="btn btn-sm btn-dark w-100">Add to cart</button></div></div></div>
      <div class="col"><div class="card product h-100"><div class="square"><img src="backpack.webp"></div><div class="card-body py-2"><div class="fw-semibold small">Backpack</div><div class="text-secondary small mb-2">₹899</div><button class="btn btn-sm btn-dark w-100">Add to cart</button></div></div></div>
      <div class="col"><div class="card product h-100"><div class="square"><img src="bottle.webp" ></div><div class="card-body py-2"><div class="fw-semibold small">Water Bottle</div><div class="text-secondary small mb-2">₹299</div><button class="btn btn-sm btn-dark w-100">Add to cart</button></div></div></div>
      <div class="col"><div class="card product h-100"><div class="square"><img src="case.webp" ></div><div class="card-body py-2"><div class="fw-semibold small">Phone Case</div><div class="text-secondary small mb-2">₹399</div><button class="btn btn-sm btn-dark w-100">Add to cart</button></div></div></div>
      <div class="col"><div class="card product h-100"><div class="square"><img src="handbag.jpg" ></div><div class="card-body py-2"><div class="fw-semibold small">Handbag</div><div class="text-secondary small mb-2">₹499</div><button class="btn btn-sm btn-dark w-100">Add to cart</button></div></div></div>
      <div class="col"><div class="card product h-100"><div class="square"><img src="juice jar.jpg"></div><div class="card-body py-2"><div class="fw-semibold small">Juice Jar</div><div class="text-secondary small mb-2">₹299</div><button class="btn btn-sm btn-dark w-100">Add to cart</button></div></div></div>
      <div class="col"><div class="card product h-100"><div class="square"><img src="mug.jpg"></div><div class="card-body py-2"><div class="fw-semibold small">Coffee Mug</div><div class="text-secondary small mb-2">349</div><button class="btn btn-sm btn-dark w-100">Add to cart</button></div></div></div>
    </div>
  </main>

  
  
  
  <footer>©LOGITHA L</footer>
 

</body>
</html>
